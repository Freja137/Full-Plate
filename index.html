<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="./style.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
	<script src="./assets/js/app.js" defer></script>
	<title>Full Plate</title>
</head>

<body>

	<header class="header">
		<nav class="nav">

			<!-- Logo -->
			<a href="#" class="logo">
				<img src="./assets/img/logo.svg" alt="Full Plate logo">
			</a>

			<!-- Navigation -->
			<ul class="nav-links">
				<li class="current-menu-item"><a href="#">Recipes</a></li>
				<li><a href="#">Stories</a></li>
				<li><a href="#">Tools</a></li>
				<li><a href="#">About</a></li>
			</ul>

			<!-- Search + login -->
			<div class="nav-actions">

				<div class="search">
					<input type="search" placeholder="Search">
					<i class="fa-solid fa-magnifying-glass"></i>
				</div>

				<a href="#" class="user-login">
					<i class="fa-regular fa-user"></i>
				</a>

			</div>

		</nav>
	</header>

	<main>

		<button class="btn"><a href="#" class="btn-arrow">EXPLORE RECIPES
				<i class="fa-solid fa-arrow-right"></i></a></button>


		<h2>FEATURED FOOD STORY</h2>
		<!-- Blå card boks -->
		<div class="blue-card">

			<img class="blue-card-img" src="./assets/img/autumn.jpg" alt="Autumn food">

			<div class="blue-box">

				<div class="blue-box-text">
					<h3>AUTUMN IS HERE</h3>
					<p>
						When the days grow colder, the<br>
						kitchen gets warmer.
					</p>
				</div>

				<div class="blue-box-bottom">
					<p>Marie | Home Cook</p>
					<a href="#" class="btn-arrow blue-card-link">
						Read the story
						<i class="fa-solid fa-arrow-right"></i>
					</a>
				</div>
			</div>

		</div>
	</main>

</body>

</html>
